[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krita-codex-mcp"
dynamic = ["version"]
description = "Local MCP bridge for reliable Krita control from Codex and Claude on Windows and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nicklas Desens" }]
dependencies = [
  "mcp>=1.12,<2",
]

[project.urls]
Homepage = "https://github.com/cyyprezz/krita-codex-mcp"
Repository = "https://github.com/cyyprezz/krita-codex-mcp.git"
Issues = "https://github.com/cyyprezz/krita-codex-mcp/issues"

[project.scripts]
krita-codex-mcp = "krita_codex_mcp.server:main"
krita-codex-install = "krita_codex_mcp.installer.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krita_codex_mcp", "src/krita_codex_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"krita-plugin" = "krita_codex_mcp/_resources/krita_plugin"

[tool.hatch.version]
path = "src/krita_codex_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/.codex/config.toml.example",
  "/docs",
  "/krita-plugin",
  "/scripts",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/server.json",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
