[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krita-codex-mcp"
version = "0.1.0"
description = "Windows-first local MCP bridge for reliable Krita control from Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krita-codex-mcp contributors" }]
dependencies = [
  "mcp>=1.12,<2",
]

[project.scripts]
krita-codex-mcp = "krita_codex_mcp.server:main"

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krita_codex_mcp", "src/krita_codex_protocol"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
