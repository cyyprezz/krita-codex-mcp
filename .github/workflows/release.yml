name: Release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-request.json
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate explicit release intent
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve the version-matched tag or main release request
        id: metadata
        shell: bash
        run: |
          tag=$(python3 scripts/verify_release.py --release-ref "$GITHUB_REF")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify / ${{ matrix.os }} / Python 3.12
    needs: release-metadata
    env:
      KRITA_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release source to be contained in main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit already contained in main."
          }

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          activate-environment: true

      - name: Test, lint, and build tagged source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked --all-groups --python 3.12
          $env:PYTHONPATH = "src"
          python scripts/verify_release.py --tag $env:KRITA_RELEASE_TAG
          python -m unittest discover -s tests -v
          ruff check .
          python -m build

      - name: Verify distributions and local wheel execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          $sdist = Get-ChildItem -LiteralPath dist -Filter *.tar.gz | Select-Object -First 1
          uvx --from twine==7.0.0 twine check --strict $wheel.FullName $sdist.FullName
          python scripts/verify_distribution.py $wheel.FullName $sdist.FullName

          $extract = Join-Path $env:RUNNER_TEMP "krita-codex-release-sdist"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xf $sdist.FullName -C $extract
          $source = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          python -m build --wheel --outdir dist/from-sdist $source.FullName
          $rebuilt = Get-ChildItem -LiteralPath dist/from-sdist -Filter *.whl | Select-Object -First 1
          python scripts/verify_distribution.py $wheel.FullName $rebuilt.FullName

          uvx --from $wheel.FullName krita-codex-install --version
          python scripts/stdio_surface_smoke.py $wheel.FullName

      - name: Verify current Codex configuration and MCP discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global @openai/codex@0.163.0 --no-audit --no-fund
          $env:PYTHONPATH = "src"
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          python scripts/codex_compatibility_smoke.py $wheel.FullName

      - name: Store verified release distributions
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  tag-release:
    name: Create requested tag after both platform checks
    needs: [release-metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create an immutable tag for the verified main commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KRITA_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$KRITA_RELEASE_TAG" -f sha="$GITHUB_SHA"

      - name: Record the validated release source
        env:
          KRITA_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: printf 'Release %s from verified commit %s\n' "$KRITA_RELEASE_TAG" "$GITHUB_SHA"

  publish-pypi:
    name: Publish verified distributions to PyPI
    needs: [build, tag-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/krita-codex-mcp
    permissions:
      id-token: write
    steps:
      - name: Download verified release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          print-hash: true
          attestations: true

  verify-pypi:
    name: Verify published PyPI distributions
    needs: [publish-pypi, release-metadata]
    runs-on: ubuntu-latest
    env:
      KRITA_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - name: Download verified release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Verify public PyPI file hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["KRITA_RELEASE_TAG"].removeprefix("v")
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path("dist").iterdir()
              if path.name.endswith((".whl", ".tar.gz"))
          }
          for attempt in range(6):
              try:
                  url = f"https://pypi.org/pypi/krita-codex-mcp/{version}/json"
                  with urllib.request.urlopen(url, timeout=15) as response:
                      release = json.load(response)
                  actual = {item["filename"]: item["digests"]["sha256"] for item in release["urls"]}
                  if len(expected) == 2 and actual == expected:
                      print(f"PyPI {version}: both published files match the verified distributions")
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              if attempt == 5:
                  raise SystemExit("Public PyPI files do not match the verified distributions")
              time.sleep(5)
          PY

  github-release:
    name: Create GitHub release
    needs: [verify-pypi, release-metadata]
    runs-on: ubuntu-latest
    env:
      KRITA_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Download published release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Create or complete the release from the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$KRITA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$KRITA_RELEASE_TAG" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$KRITA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest
          else
            gh release create "$KRITA_RELEASE_TAG" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Krita Codex MCP $KRITA_RELEASE_TAG"
          fi
